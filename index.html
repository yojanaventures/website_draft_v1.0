<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yojna Ventures | Opening 14 May 2027</title>
  <meta name="description" content="A quiet signal from something yet to emerge. Yojna Ventures.">
  <meta name="theme-color" content="#144a13">

  <meta property="og:title" content="Yojna Ventures | Opening 14 May 2027">
  <meta property="og:description" content="The future leaves traces before it takes shape.">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts: Unbounded (wide, like the logo letters) + Manrope (quiet body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Unbounded:wght@200;300;400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Dotted terrain, drawn by js/main.js. It echoes the stippled hills inside the logo. -->
  <canvas id="terrain" aria-hidden="true"></canvas>

  <main class="stage container-xxl">
    <div class="row align-items-center align-content-center g-4 g-lg-5 min-vh-100 py-5">

      <!-- Logo -->
      <div class="col-12 col-lg-7">
        <h1 class="logo" id="logo">
          <span class="logo-tilt" id="logoTilt">
            <img class="logo-base" src="logo.png" alt="Yojna Ventures" width="1600" height="612">
            <img class="logo-lit" src="logo-lit.png" alt="" aria-hidden="true" width="1600" height="612">
          </span>
        </h1>
      </div>

      <!-- Date + countdown -->
      <div class="col-12 col-lg-5">
        <section class="info" aria-label="Launch countdown">
          <p class="opens">Opening on</p>
          <p class="date">14 May 2027</p>

          <div class="clock" id="clock" role="timer" aria-live="off">
            <div class="unit"><span class="num" id="d-days">000</span><span class="lab">days</span></div>
            <div class="unit"><span class="num" id="d-hours">00</span><span class="lab">hours</span></div>
            <div class="unit"><span class="num" id="d-minutes">00</span><span class="lab">minutes</span></div>
            <div class="unit"><span class="num" id="d-seconds">00</span><span class="lab">seconds</span></div>
          </div>

          <p class="note">The future leaves traces before it takes shape.</p>
        </section>
      </div>

    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
